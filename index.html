<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RipWatch</title><style>body{margin:0;background:#0a1128;color:#e6f1ff;font-family:system-ui,sans-serif;padding:16px;max-width:700px;margin:auto}h1{color:#39ff9c;margin:0 0 4px}.sub{color:#8aa0c0;font-size:14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{background:#12204a;border:1px solid #1f3a7a;border-radius:10px;padding:12px}.n{font-size:24px;font-weight:700;color:#2de2e6}.l{font-size:12px;color:#8aa0c0}h2{color:#b57bff;margin:20px 0 8px;font-size:18px}.hit{background:#12204a;border-radius:8px;padding:10px;margin-bottom:8px}.usd{color:#39ff9c;font-weight:700;font-size:18px}.small{font-size:12px;color:#8aa0c0}.foot{margin-top:24px;font-size:12px;color:#8aa0c0}</style></head><body><h1>RipWatch</h1><div class="sub" id="up">Loading...</div><div class="grid"><div class="box"><div class="n" id="a">-</div><div class="l">Rips last hour</div></div><div class="box"><div class="n" id="b">-</div><div class="l">Rips last 24h</div></div><div class="box"><div class="n" id="c">-</div><div class="l">Buybacks last hour</div></div><div class="box"><div class="n" id="d">-</div><div class="l">Buybacks last 24h</div></div><div class="box"><div class="n" id="e">-</div><div class="l">Median buyback 24h</div></div></div><h2>Top 5 buybacks, last 24h</h2><div id="top"></div><a href="about.html" style="color:#2de2e6">About</a> <a href="calculator.html" style="color:#2de2e6">Calculator</a><div class="foot">Not affiliated with Courtyard. Data is read from the public Polygon blockchain. Wallets are shortened.</div><script>function money(x){return "$"+Number(x).toLocaleString(undefined,{maximumFractionDigits:0})}function set(i,v){document.getElementById(i).textContent=v}function load(){fetch("live.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){set("up","Updated "+d.updated);set("a",Number(d.rips_last_hour).toLocaleString());set("b",Number(d.rips_last_24h).toLocaleString());set("c",money(d.buybacks_last_hour_usd));set("d",money(d.buybacks_last_24h_usd));set("e","$"+Number(d.median_buyback_24h).toFixed(2));var box=document.getElementById("top");box.textContent="";d.top_24h.slice(0,5).forEach(function(h){var div=document.createElement("div");div.className="hit";var u=document.createElement("div");u.className="usd";u.textContent=money(h.usd);var c=document.createElement("div");c.textContent=h.card.charAt(0)=="#"?"Unnamed card":h.card;var s=document.createElement("div");s.className="small";s.textContent="Wallet "+h.wallet+" at "+h.time;div.appendChild(u);div.appendChild(c);div.appendChild(s);box.appendChild(div)})}).catch(function(){set("up","Could not load data")})}load();setInterval(load,60000);</script></body></html>
